[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "querypilot"
version = "0.1.0"
description = "An AI-powered interface for natural-language database queries with SQL-backed answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "streamlit>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "SQLAlchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "sqlglot>=25.0.0",
    "sqlparse>=0.5.0",
    "openai>=1.50.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
local-llm = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "accelerate>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
